name: Build FRONDA macOS friend build

on:
  workflow_dispatch:
  push:
    paths:
      - "MAC/**"
      - ".github/workflows/mac-friend-build.yml"

jobs:
  build-mac-friend:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: MAC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MAC/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned universal macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac:friend

      - name: Inspect build outputs
        run: |
          echo "Contents of MAC/release:"
          find release -maxdepth 3 -type f | sort || true
          echo "Contents of repo-root release if it exists:"
          find ../release -maxdepth 3 -type f | sort || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fronda-mac-friend-build
          path: |
            release/**/*.dmg
            release/**/*.zip
            ../release/**/*.dmg
            ../release/**/*.zip
            MAC/release/*.dmg
            MAC/release/*.zip
            MAC/release/**/*.dmg
            MAC/release/**/*.zip
          if-no-files-found: error
