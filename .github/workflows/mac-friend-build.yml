name: Build FRONDA macOS friend build

on:
  workflow_dispatch:
  push:
    paths:
      - "MAC/**"
      - ".github/workflows/mac-friend-build.yml"

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-mac-friend:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: MAC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MAC/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned universal macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac:friend

      - name: Inspect build outputs
        run: |
          echo "Contents of MAC/dist:"
          find dist -maxdepth 3 -type f | sort || true
          echo "Contents of MAC/release if it exists:"
          find release -maxdepth 3 -type f | sort || true

      - name: Collect artifacts into ci-output
        run: |
          rm -rf ../ci-output
          mkdir -p ../ci-output
          find dist release ../release -type f \( -name '*.dmg' -o -name '*.zip' \) -print -exec cp '{}' ../ci-output/ \; || true
          echo "Collected files:"
          find ../ci-output -maxdepth 2 -type f | sort || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fronda-mac-friend-build
          path: ci-output/**
          if-no-files-found: error
